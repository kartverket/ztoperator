apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: application
spec:
  podSettings:
    annotations:
      ztoperator.kartverket.no/verify-authpolicy: "true"
      ztoperator.kartverket.no/inject: "true"
  image: hashicorp/http-echo:latest
  port: 5678
  replicas: 1
  ingresses:
    - foo.bar
  accessPolicy:
    outbound:
      rules:
        - application: mock-oauth2
          namespace: auth
