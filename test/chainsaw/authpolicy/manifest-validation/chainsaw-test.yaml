apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: manifest-validation
spec:
  skip: false
  concurrent: true
  skipDelete: false
  namespaceTemplate:
    metadata:
      name: chainsaw-manifest-validation
      labels:
        istio-injection: enabled

  steps:
    - try:
        - create:
            file: ../../../resources/skiperator/application.yaml


        - create:
            file: methods/authpolicy.yaml
        - script: # Methods
            content: |
              ./../../../../scripts/patch-invalid-spec.sh \
                methods/patch-invalid-auth-rule-method.yaml \
                'Unsupported value: "INVALID_METHOD"'

              ./../../../../scripts/patch-invalid-spec.sh \
                methods/patch-invalid-ignore-auth-rule-method.yaml \
                'Unsupported value: "INVALID_METHOD"'
        - delete:
            file: methods/authpolicy.yaml
