apiVersion: ztoperator.kartverket.no/v1alpha1
kind: AuthPolicy
metadata:
  name: auth-policy
spec:
  enabled: true
  allowedAudiences:
    - value: private_jwk_server
  ignoreAuthRules:
    - paths:
        - /public*
  oAuthCredentials:
    clientIDKey: CLIENT_ID
    privateJwkKey: PRIVATE_JWK
    secretRef: oauth-secret
  autoLogin:
    enabled: true
    logoutPath: /logout
    redirectPath: /oauth2/callback
    scopes:
      - openid
  wellKnownURI: http://mock-oauth2.auth:8080/private-jwk/.well-known/openid-configuration
  selector:
    matchLabels:
      app: application
