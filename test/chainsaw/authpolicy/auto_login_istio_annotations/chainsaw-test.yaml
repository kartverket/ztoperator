apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: auto-login-istio-annotations
spec:
  skip: false
  concurrent: true
  skipDelete: false
  namespaceTemplate:
    metadata:
      labels:
        istio-injection: enabled
        skip.kartverket.no/skip-managed: "true"
  steps:
    - try:
        - apply:
            file: ../../../resources/ingress/wildcard-ingress.yaml
        - create:
            file: ../../../resources/secret/oauth-secret.yaml
        - create:
            file: authpolicy.yaml
        - assert:
            resource:
              apiVersion: ztoperator.kartverket.no/v1alpha1
              kind: AuthPolicy
              metadata:
                name: auth-policy
              status:
                ready: true
        - create:
            file: ../../../resources/skiperator/application-with-istio-mount-verified.yaml
        - assert:
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: application
        # Restart to clear stale FailedCreate conditions from before the ServiceAccount existed
        - script:
            content: kubectl delete replicaset -n $NAMESPACE -l app=application --ignore-not-found
        - assert:
            file: pod-assert.yaml
        - script:
            content: sleep 14
        - script:
            content: |
              hurl --error-format long \
              --insecure --test tests.hurl
