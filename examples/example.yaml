apiVersion: v1
kind: Namespace
metadata:
  name: test
  labels:
    skip.kartverket.no/skip-managed: "true"
    istio.io/rev: default
---
apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: app
  namespace: test
spec:
  podSettings:
    annotations:
      ztoperator.kartverket.no/verify-authpolicy: "true"
      ztoperator.kartverket.no/inject: "true"
      sidecar.istio.io/logLevel: 'debug'
  image: hashicorp/http-echo:latest
  port: 5678
  replicas: 1
  ingresses:
    - demo.localdev
  accessPolicy:
    outbound:
      rules:
        - application: mock-oauth2
          namespace: auth
---
apiVersion: ztoperator.kartverket.no/v1alpha1
kind: AuthPolicy
metadata:
  name: auth-policy
  namespace: test
spec:
  selector:
    matchLabels:
      app: app
  enabled: true
  wellKnownURI: http://mock-oauth2.auth:8080/ztoperator/.well-known/openid-configuration
  autoLogin:
    enabled: true
    scopes:
      - openid
  oAuthCredentials:
    clientIDKey: CLIENT_ID
    clientSecretKey: CLIENT_SECRET
    secretRef: oauth-secret
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: oauth-secret
  namespace: test
data:
  CLIENT_ID: ZW50cmFpZF9zZXJ2ZXI=
  CLIENT_SECRET: ZHVtbXlfc2VjcmV0