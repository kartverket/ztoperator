apiVersion: v1
kind: Namespace
metadata:
  name: test-ambient
  labels:
    skip.kartverket.no/skip-managed: "true"
    istio.io/dataplane-mode: "ambient"
---
apiVersion: skiperator.kartverket.no/v1alpha1
kind: Application
metadata:
  name: app
  namespace: test-ambient
spec:
  podSettings:
    annotations:
      ztoperator.kartverket.no/verify-authpolicy: "true"
  image: hashicorp/http-echo:latest
  port: 5678
  replicas: 1
  ingresses:
    - demo.ambient.localdev
  accessPolicy:
    outbound:
      rules:
        - application: mock-oauth2
          namespace: auth
  extraContainers:
    - image: envoyproxy/envoy:distroless-v1.40.2@sha256:09ca6f2140a61ad8df11779a4a30d52b48433d444466328494f9188c9c35eded
      name: envoy
      additionalPorts:
        - name: envoy-main
          port: 18080
          protocol: TCP
        - name: envoy-probe
          port: 18081
          protocol: TCP
      args:
        - "--config-path"
        - "/etc/envoy/envoy.json"
        - "-l"
        - "info"
        - "--concurrency"
        - "1"
      ingressPort: 18080
      filesFrom:
        - mountPath: /etc/envoy
          configMap: auth-policy-envoy-bootstrap
        - mountPath: /etc/istio/config
          secret: auth-policy-envoy-secret
      readiness:
        path: /ready
        port: 18081
      startup:
        path: /ready
        port: 18081
      resources:
        limits:
          memory: "128Mi"
          cpu: "200m"
        requests:
          memory: "128Mi"
          cpu: "1m"
      type: init
---
apiVersion: ztoperator.kartverket.no/v1alpha1
kind: AuthPolicy
metadata:
  name: auth-policy
  namespace: test-ambient
spec:
  selector:
    matchLabels:
      app: app
  enabled: true
  wellKnownURI: http://mock-oauth2.auth:8080/ztoperator/.well-known/openid-configuration
  autoLogin:
    enabled: true
    scopes:
      - openid
  oAuthCredentials:
    clientIDKey: CLIENT_ID
    clientSecretKey: CLIENT_SECRET
    secretRef: oauth-secret
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: oauth-secret
  namespace: test-ambient
data:
  CLIENT_ID: ZW50cmFpZF9zZXJ2ZXI=
  CLIENT_SECRET: ZHVtbXlfc2VjcmV0