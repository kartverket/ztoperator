name: Run Chainsaw Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Hurl
        uses: gacts/install-hurl@ab6d0234456944b022ef7d1f594845af9561357d # v1.3.4
        with:
          version: '6.1.1'

      - name: Setup local cluster, deploy Ztoperator, make virtualenv, expose ingress and run chainsaw tests
        run: |
          make local deploy virtualenv expose-ingress chainsaw-test-all
