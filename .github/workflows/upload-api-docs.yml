name: Write API-docs to skip.kartverket.no

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api-docs.md'

concurrency:
  group: api-docs-upload
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  update-docs:
    name: Update ztoperator documentation in skip.kartverket.no
    uses: kartverket/github-workflows/.github/workflows/update-skip-docs.yaml@c3fabaec85ee208e5f10782ac71b5a82b30c6bb3 # v4.13.2
    with:
      source_path: "api-docs.md"
      target_path: "docs/08-tilgangsstyring/08-ztoperator/03-api-docs.md"
      branch_name: "update-ztoperator-docs"
      author_name: "GithubActions <ztoperator@kartverket.no>"
      identity: "ztoperator"